[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "handwriting-plotter"
version = "0.2.0+20261014.2"
description = "Deterministic single-line handwriting layout and virtual plotter export"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Handwriting Plotter contributors" }]
dependencies = [
  "pydantic==2.14.1",
  "regex==2026.9.29",
]

[project.optional-dependencies]
import-svg = [
  "defusedxml==0.7.1",
  "svg.path==7.1",
]
gui = [
  "PySide6==6.12.0",
]
gui-dev = [
  "PySide6==6.12.0",
  "pytest-qt==4.5.0",
]
dev = [
  "hypothesis==6.169.0",
  "pytest==9.1.1",
]

[project.scripts]
hplot = "handwriting_plotter.cli:main"
hplot-gui = "handwriting_plotter.gui.application:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handwriting_plotter"]

[tool.hatch.build.targets.wheel.force-include]
"assets/styles" = "handwriting_plotter/assets/styles"
"profiles/virtual-cartesian-z-v1.json" = "handwriting_plotter/assets/profiles/virtual-cartesian-z-v1.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

