[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "handwriting-plotter"
version = "0.1.0"
description = "Deterministic single-line handwriting layout and virtual plotter export"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Handwriting Plotter contributors" }]
dependencies = [
  "pydantic==2.14.1",
  "regex==2026.9.29",
]

[project.optional-dependencies]
import-svg = [
  "defusedxml==0.7.1",
  "svg.path==7.1",
]
dev = [
  "hypothesis==6.169.0",
  "pytest==9.1.1",
]

[project.scripts]
hplot = "handwriting_plotter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handwriting_plotter"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

